server {
    listen 8000;
    client_max_body_size 20m;            # 与后端 max_image_mb 对齐

    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;         # 大图推理 + 排队等待
    }

    location / {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
    }

    # 生产建议：https://your-domain 由外层（Caddy/ALB/cert）终结后转发到这里
}
