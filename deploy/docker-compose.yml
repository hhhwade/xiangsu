# AI 美颜修图后端一键部署（GPU 版）
# 使用: cd deploy && cp .env.example .env && 修改后 docker compose up -d --build
# GPU 需要: NVIDIA 驱动 ≥ 530, nvidia-container-toolkit, CUDA 12.1+
version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API（供 APP 拉取图片 URL；公网务必改强密码或仅内网）
      - "9001:9001"   # 控制台
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:                      # 首次启动自动建 bucket
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123};
      mc mb -p local/${S3_BUCKET:-beauty} || true;
      mc anonymous set none local/${S3_BUCKET:-beauty};
      "
    restart: "no"

  server:                          # FastAPI（无 GPU 也可运行）
    build:
      context: ../server
    image: beauty-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      MODE: ${MODE:-auto}
    volumes:
      - ${MODEL_DIR:-./models}:/models
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:                          # GPU 推理 worker — 8–12G 显存单并发
    build:
      context: ../server
    image: beauty-server:latest
    restart: unless-stopped
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      MODE: ${MODE:-auto}
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    volumes:
      - ${MODEL_DIR:-./models}:/models
      - hf-cache:/root/.cache/huggingface      # 首次自动下载 HF 模型后持久化
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:8000"                            # APP 直接访问这个端口（或前面再接 HTTPS 反代）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

volumes:
  redis-data:
  minio-data:
  hf-cache:
