<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#102f30" />
  <title>行迹 · 智能旅行</title>
  <style>
    :root { --ink:#183b3a; --deep:#102f30; --paper:#f6f7f3; --card:#ffffff; --line:#e1e8e1; --muted:#758783; --accent:#db7040; --mint:#3d8173; --day:#df7445; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    body { overflow:hidden; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .app { height:100vh; display:flex; flex-direction:column; overflow:hidden; background:linear-gradient(180deg,#f7f8f4 0,#f4f6f2 100%); }
    .topbar { flex:0 0 52px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; color:#fff; background:var(--deep); box-shadow:0 2px 9px rgba(11,39,39,.12); }
    .brand { display:flex; align-items:center; gap:8px; font-family:serif; font-size:18px; font-weight:700; letter-spacing:.08em; }
    .brand-mark { width:27px; height:27px; display:grid; place-items:center; border-radius:9px; color:#edb37f; background:rgba(255,255,255,.1); font-size:18px; }
    .header-action { height:29px; padding:0 9px; border:1px solid rgba(255,255,255,.22); border-radius:7px; color:#d5e3dc; background:rgba(255,255,255,.06); font-size:10px; font-weight:700; }
    .header-action:active { background:rgba(255,255,255,.15); }
    .content { flex:1; overflow-y:auto; padding:12px 12px 24px; scrollbar-width:none; }
    .content::-webkit-scrollbar { display:none; }
    .trip-hero { padding:12px; border:1px solid #d8e5dc; border-radius:13px; background:linear-gradient(135deg,#eef6ef 0,#fdfdf9 72%); box-shadow:0 4px 14px rgba(28,73,62,.055); }
    .hero-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .hero-kicker { color:#718e84; font-family:monospace; font-size:8px; font-weight:700; letter-spacing:.12em; }
    .hero-city { display:flex; align-items:center; gap:6px; margin-top:3px; color:#214743; font-family:serif; font-size:20px; font-weight:700; }
    .hero-city i { color:var(--accent); font-family:sans-serif; font-size:18px; font-style:normal; }
    .hero-generate { flex:0 0 auto; height:34px; padding:0 10px; border:0; border-radius:8px; color:#fff; background:var(--accent); box-shadow:0 5px 12px rgba(214,96,49,.2); font-size:10px; font-weight:800; }
    .hero-generate:active { transform:translateY(1px); }
    .summary-stats { display:flex; gap:6px; margin-top:11px; }
    .summary-stat { flex:1; min-width:0; padding:7px 8px; border:1px solid rgba(197,216,204,.85); border-radius:8px; color:#71837e; background:rgba(255,255,255,.75); font-size:8px; }
    .summary-stat b { display:block; overflow:hidden; margin-top:2px; color:#315e56; font-family:monospace; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .editor { margin-top:9px; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:0 3px 10px rgba(23,51,45,.035); transition:max-height .25s ease; }
    .editor.collapsed { max-height:0; margin-top:0; border-width:0; box-shadow:none; }
    .editor-inner { padding:12px; }
    .editor-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; color:#4f6d66; font-size:10px; font-weight:800; }
    .editor-title small { color:#92a19c; font-size:8px; font-weight:500; }
    .destination { display:flex; align-items:center; height:39px; border:1px solid #ccd8cf; border-radius:8px; background:#fff; }
    .destination span { padding:0 8px 0 10px; color:var(--accent); font-size:17px; }
    .destination input { width:100%; min-width:0; height:100%; border:0; outline:0; color:#2b504c; background:transparent; font-size:12px; font-weight:700; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px; }
    .field label { display:block; margin-bottom:4px; color:#778883; font-size:8px; font-weight:700; }
    .compact { display:flex; align-items:center; height:32px; overflow:hidden; border:1px solid #d9e1da; border-radius:7px; background:#fbfcfa; }
    .compact input { width:100%; min-width:0; height:100%; padding:0 8px; border:0; outline:0; color:#385853; background:transparent; font-size:11px; font-weight:700; }
    .compact span { padding-right:8px; color:#84928e; font-size:9px; }
    .label-row { display:flex; justify-content:space-between; margin:11px 0 6px; color:#596f69; font-size:9px; font-weight:800; }
    .label-row small { color:#9aa7a2; font-size:8px; font-weight:500; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; }
    .chip { height:26px; padding:0 7px; border:1px solid #dce4dd; border-radius:6px; color:#7c8b86; background:#fafbf8; font-size:8px; }
    .chip.on { border-color:#559080; color:#2e695e; background:#e8f3eb; font-weight:800; }
    .modes { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
    .mode { min-height:35px; border:1px solid #dbe3dc; border-radius:7px; color:#7b8b86; background:#fbfcfa; font-size:9px; }
    .mode.on { border-color:#39796c; color:#285f56; background:#e7f1ea; font-weight:800; }
    .generate { display:flex; align-items:center; justify-content:center; width:100%; height:39px; gap:5px; margin-top:12px; border:0; border-radius:8px; color:#fff; background:var(--accent); font-size:11px; font-weight:800; }
    .section-head { display:flex; align-items:flex-end; justify-content:space-between; margin:16px 1px 0; }
    .eyebrow { margin:0; color:#739188; font-family:monospace; font-size:8px; font-weight:700; letter-spacing:.11em; }
    .section-head h2 { margin:4px 0 0; color:#264743; font-family:serif; font-size:17px; letter-spacing:-.02em; }
    .edit-button { height:27px; padding:0 8px; border:1px solid #cfddd3; border-radius:6px; color:#4e7b71; background:#edf5ef; font-size:9px; font-weight:800; }
    .days { display:flex; gap:5px; margin:10px 0; overflow-x:auto; scrollbar-width:none; }
    .days::-webkit-scrollbar { display:none; }
    .day { flex:0 0 auto; height:29px; padding:0 9px; border:1px solid transparent; border-radius:7px; color:#778782; background:transparent; font-size:9px; font-weight:800; }
    .day.on { border-color:#c8dbd0; color:#2d6258; background:#e5f0e8; }
    .day-dot { display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%; vertical-align:middle; }
    .route-card { padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:0 4px 12px rgba(29,59,51,.035); }
    .route-title { display:flex; gap:8px; align-items:center; }
    .route-bar { width:6px; height:30px; border-radius:6px; background:var(--day); }
    .route-title p { margin:0 0 2px; color:#82918c; font-family:monospace; font-size:8px; letter-spacing:.08em; }
    .route-title h3 { margin:0; color:#284944; font-family:serif; font-size:16px; letter-spacing:-.025em; }
    .route-desc { margin:9px 0 0; color:#71827d; font-size:9px; line-height:1.5; }
    .stats { display:flex; gap:7px; margin:9px 0; color:#879692; font-size:8px; }
    .stats b { color:#437066; font-family:monospace; }
    .stats i { width:3px; height:3px; margin-top:4px; border-radius:50%; background:#bdc7c0; }
    .optimized { display:flex; align-items:center; gap:5px; min-height:28px; padding:0 8px; border:1px solid #d9e8df; border-radius:6px; color:#54766e; background:#edf6ef; font-size:8px; }
    .optimized b { color:#327168; }
    .optimized em { margin-left:auto; color:#5f9f86; font-style:normal; }
    .spots { position:relative; margin:11px 0 0; padding:0; list-style:none; }
    .spot { position:relative; display:grid; grid-template-columns:42px 1fr; min-height:64px; cursor:grab; }
    .spot:active { cursor:grabbing; }
    .spot-time { position:relative; padding:8px 8px 0 0; color:#879692; font-family:monospace; font-size:8px; text-align:right; }
    .spot-time:after { content:""; position:absolute; right:2px; top:26px; bottom:-4px; width:1px; background:#dce3dc; }
    .spot:last-child .spot-time:after { display:none; }
    .order { position:absolute; z-index:2; right:-5px; top:21px; display:grid; width:17px; height:17px; place-items:center; border:2px solid #fff; border-radius:50%; color:#fff; background:var(--day); box-shadow:0 1px 4px rgba(33,60,52,.18); font-size:8px; font-style:normal; }
    .spot-box { margin:0 0 8px 5px; padding:8px 9px; border:1px solid transparent; border-radius:8px; }
    .spot.selected .spot-box { border-color:#a9cbbc; background:#eff8f1; box-shadow:0 2px 8px rgba(42,105,89,.07); }
    .spot-name { display:flex; justify-content:space-between; gap:6px; color:#2f4d49; font-size:10px; font-weight:800; }
    .spot-name span:last-child { color:#699486; font-size:12px; }
    .spot-meta { margin-top:4px; color:#81918c; font-size:8px; }
    .spot-meta b { padding:2px 4px; border-radius:3px; color:#a45d39; background:#fae9df; font-weight:600; }
    .spot-tip { overflow:hidden; margin:4px 0 0; color:#8b9894; font-size:8px; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
    .segment { display:flex; gap:4px; align-items:center; grid-column:2; padding:0 0 6px 9px; color:#91a09b; font-size:8px; }
    .segment span:first-child { color:#ce7043; font-size:11px; }
    .notice { margin-top:10px; padding:9px; border:1px solid #eee3d5; border-radius:7px; color:#897c70; background:#fdf8f1; font-size:8px; line-height:1.55; }
    .notice b { color:#a06a48; }
    .toast { position:fixed; z-index:9; left:50%; bottom:12px; max-width:calc(100% - 24px); padding:8px 10px; border-radius:7px; color:#3d685d; background:#f6fff8; box-shadow:0 8px 20px rgba(20,50,42,.2); font-size:9px; font-weight:700; opacity:0; transform:translate(-50%,10px); transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">行</span>行迹</div>
      <button class="header-action" id="toggleEditor">调整行程</button>
    </header>
    <section class="content">
      <section class="trip-hero">
        <div class="hero-row">
          <div><div class="hero-kicker">SMART TRIP · 已优化</div><div class="hero-city"><i>⌖</i><span id="overviewCity">杭州</span></div></div>
          <button class="hero-generate" id="quickGenerate">重新规划</button>
        </div>
        <div class="summary-stats">
          <div class="summary-stat">停留时间<b id="overviewDays">3 天</b></div>
          <div class="summary-stat">每日游玩<b id="overviewHours">8 小时</b></div>
          <div class="summary-stat">出行方式<b id="overviewMode">自驾</b></div>
        </div>
      </section>

      <section class="editor collapsed" id="editor">
        <div class="editor-inner">
          <div class="editor-title"><span>规划参数</span><small>全国城市 · 动态分天</small></div>
          <div class="destination"><span>⌖</span><input id="destination" value="杭州" list="cityList" aria-label="目的地"><datalist id="cityList"></datalist></div>
          <div class="row">
            <div class="field"><label>停留天数（1–30）</label><div class="compact"><input id="duration" type="number" value="3" min="1" max="30"><span>天</span></div></div>
            <div class="field"><label>每日游玩</label><div class="compact"><input id="hours" type="number" value="8" min="2" max="16"><span>小时</span></div></div>
          </div>
          <div class="label-row"><span>偏好类型</span><small>可多选</small></div>
          <div class="chips" id="prefs"></div>
          <div class="label-row"><span>出行方式</span><small>切换后重算路线</small></div>
          <div class="modes" id="modes"></div>
          <button class="generate" id="generate">✦ 生成智能路线</button>
        </div>
      </section>

      <div class="section-head"><div><p class="eyebrow">CURRENT ITINERARY</p><h2 id="itineraryTitle">杭州 · 3 天路线</h2></div><button class="edit-button" id="inlineEdit">编辑</button></div>
      <nav class="days" id="days"></nav>
      <section class="route-card" id="routeCard"></section>
    </section>
    <div class="toast" id="toast"></div>
  </main>
  <script src="route-panel.js"></script>
</body>
</html>
